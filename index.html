<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Experience</title>

    <style>
        /* Base Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        /* Video Section */
        #video-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #ad-video {
            width: min(90vw, 1000px);
            height: min(70vh, 562px);
            border: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .btn-skip {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
        }

        .btn-skip:hover {
            background: #eee;
        }

        /* Store Section */
        #store-section {
            padding: 40px 5%;
            max-width: 1400px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            background: rgba(249,249,249,0.95);
            padding: 20px 0;
            z-index: 10;
            border-bottom: 1px solid #ddd;
        }

        .checkout-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .timer-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        #checkout-timer {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 90px;
            text-align: right;
        }

        .checkout-btn {
            padding: 15px 30px;
            background: #000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .checkout-btn:hover {
            background: #333;
        }

        .checkout-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* Product Grids */
        .category-container {
            margin-bottom: 60px;
        }

        .category-title {
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        /* Product Cards */
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eaeaea;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 16px;
            margin: 0 0 15px 0;
            height: 40px;
            overflow: hidden;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #0056b3;
        }

        .add-btn.added {
            background: #28a745;
        }

        .add-btn.added:hover {
            background: #218838;
        }
    </style>

           ======================================================== */

        let timerStart = null;

        let timerInterval = null;

        let finalTimeSeconds = null;

        let checkoutSubmitted = false;


        /* ========================================================

           ======================================================== */

        proceedBtn.onclick = () => {

        /* ========================================================
           SHOW STORE + START TIMER
           ======================================================== */

        function showStore() {

            videoSection.classList.add('hidden');

            storeSection.classList.remove('hidden');

            window.scrollTo(0, 0);


            /*
             * Start the timer only once.
             */

            if (timerStart === null) {

                timerStart = performance.now();

                timerInterval =
                    setInterval(updateTimerDisplay, 100);

                updateTimerDisplay();

            }

        }


        /* ========================================================
           FORMAT TIME AS HH:MM:SS
           ======================================================== */

        function formatTime(totalSeconds) {

            const total =
                Math.floor(totalSeconds);


            const hours =
                Math.floor(total / 3600);


            const minutes =
                Math.floor(
                    (total % 3600) / 60
                );


            const seconds =
                total % 60;


            return (
                String(hours).padStart(2, '0') +
                ':' +
                String(minutes).padStart(2, '0') +
                ':' +
                String(seconds).padStart(2, '0')
            );

        }


        /* ========================================================
           UPDATE TIMER
           ======================================================== */

        function updateTimerDisplay() {

            if (
                timerStart === null ||
                finalTimeSeconds !== null
            ) {

                return;

            }


            const elapsed =
                (performance.now() - timerStart) / 1000;


            checkoutTimer.textContent =
                formatTime(elapsed);

        }


        /* ========================================================
           STOP TIMER
           ======================================================== */

        function stopTimer() {

            if (timerStart === null) {

                return 0;

            }


            finalTimeSeconds =
                (performance.now() - timerStart) / 1000;


            clearInterval(timerInterval);

            timerInterval = null;


            /*
             * Freeze the timer.
             */

            checkoutTimer.textContent =
                formatTime(finalTimeSeconds);


            /*
             * Save locally as an additional backup.
             */

            sessionStorage.setItem(
                'finalTimeSeconds',
                finalTimeSeconds.toFixed(1)
            );


            sessionStorage.setItem(
                'finalTimeDisplay',
                formatTime(finalTimeSeconds)
            );


            return finalTimeSeconds;

        }


        /* ========================================================
           RENDER PRODUCTS
           ======================================================== */

        function renderCategory(categoryId, items) {

            const grid =
                document.getElementById(
                    categoryId + '-grid'
                );


            items.forEach(item => {

                const card =
                    document.createElement('div');


                card.className =
                    'product-card';


                card.innerHTML = `

                    <img
                        src="${item.img}"
                        alt="${item.name}"
                        onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22200%22%20style%3D%22background%3A%23eaeaea%22%3E%3C%2Fsvg%3E'"
                    >

                    <h3>
                        ${item.name}
                    </h3>

                    <button
                        class="add-btn"
                        onclick="toggleCart('${item.name}', this)"
                    >
                        Add to Cart
                    </button>

                `;


                grid.appendChild(card);

            });

        }

           INITIALIZE PRODUCTS
           ======================================================== */

        /* ========================================================
           CART LOGIC
           ======================================================== */

        window.toggleCart =
            function(productName, btnElement) {


                if (cart.includes(productName)) {

                    /*
                     * Remove from cart.
                     */

                    cart =
                        cart.filter(
                            item =>
                                item !== productName
                        );


                    btnElement.textContent =
                        "Add to Cart";


                    btnElement.classList.remove(
                        'added'
                    );


                } else {

                    /*
                     * Add to cart.
                     */

                    cart.push(productName);


                    btnElement.textContent =
                        "Added ✓";


                    btnElement.classList.add(
                        'added'
                    );

                }


                checkoutBtn.textContent =
                    `Checkout (${cart.length} items)`;

            };


        /* ========================================================
           CHECKOUT
           ======================================================== */

        checkoutBtn.onclick = () => {

            /*
             * Stop multiple clicks.
             */

            if (checkoutSubmitted) {

                return;

            }


            checkoutSubmitted = true;


            /*
             * Stop and freeze the timer.
             */

            const timeTaken =
                stopTimer();


            /*
             * Disable checkout button.
             */

            checkoutBtn.disabled = true;


            /*
             * Start with the Google Form.
             */

            let formUrl =
                googleFormLink;


            /*
             * Add the automatically calculated
             * HH:MM:SS value to:
             *
             * entry.976760102
             */

            const separator =
                formUrl.includes('?')
                    ? '&'
                    : '?';


            formUrl +=
                separator +
                'usp=pp_url&' +
                encodeURIComponent(
                    timeFormEntryId
                ) +
                '=' +
                encodeURIComponent(
                    formatTime(timeTaken)
                );


            /*
             * Send user to Google Form.
             */

            window.location.href =
                formUrl;

        };
